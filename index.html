    <script>
    // Theme behavior: toggle binding + browser-chrome color sync + system following.
    // Initial theme class is applied by the inline script at the top of <body>
    // (header.ejs / index.ejs), before first paint — no flash.
    (function () {
        var configDefault = 'dark';

        var syncThemeColor = function (dark) {
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            if (metas.length > 0) {
                // Keep the first, drop the media-qualified duplicates
                for (var i = 1; i < metas.length; i++) metas[i].remove();
                metas[0].setAttribute('content', dark ? '#1e1f22' : '#ffffff');
                metas[0].removeAttribute('media');
            }
        };

        var updateButtons = function (dark) {
            var ids = ['theme-toggle-sun', 'theme-toggle-moon',
                       'mobile-theme-toggle-sun', 'mobile-theme-toggle-moon'];
            for (var i = 0; i < ids.length; i++) {
                var el = document.getElementById(ids[i]);
                if (!el) continue;
                var isSun = ids[i].indexOf('sun') !== -1;
                el.style.display = (dark === !isSun) ? 'inline-block' : 'none';
            }
        };

        document.addEventListener('DOMContentLoaded', function () {
            var body = document.body;
            var dark = body.classList.contains('dark-theme');

            syncThemeColor(dark);
            updateButtons(dark);

            var toggle = function (e) {
                if (e) e.stopPropagation();
                dark = !body.classList.contains('dark-theme');
                body.classList.toggle('dark-theme', dark);
                updateButtons(dark);
                syncThemeColor(dark);
                try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (err) {}
            };

            ['theme-toggle-sun', 'theme-toggle-moon',
             'mobile-theme-toggle-sun', 'mobile-theme-toggle-moon'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.addEventListener('click', toggle);
            });

            // Follow the OS while the visitor has not chosen manually.
            var hasSaved = false;
            try { hasSaved = !!localStorage.getItem('theme'); } catch (err) {}
            if (window.matchMedia && !hasSaved) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
                    dark = e.matches;
                    body.classList.toggle('dark-theme', dark);
                    updateButtons(dark);
                    syncThemeColor(dark);
                });
            }
        });
    })();
</script>

<script>
    // Reading Progress Component
    document.addEventListener('DOMContentLoaded', () => {
        const progressValue = document.querySelector('.reading-value');
        const progressCircle = document.querySelector('.progress-ring__circle');
        const container = document.querySelector('.reading-progress-container');

        // Exit if elements don't exist (e.g., not on a post page)
        if (!progressValue || !progressCircle || !container) {
            return;
        }

        // SVG Circle setup
        const radius = progressCircle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;

        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = circumference;

        function setProgress(percent) {
            const safePercent = Math.min(100, Math.max(0, percent));
            progressValue.textContent = `${Math.round(safePercent)}%`;
            const offset = circumference - (safePercent / 100) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        function onScroll() {
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;

            if (scrollHeight <= 0) {
                setProgress(0);
                return;
            }

            const scrollPercent = (scrollTop / scrollHeight) * 100;
            setProgress(scrollPercent);

            // Show/Hide logic: Show if scrolled more than 100px
            if (scrollTop > 100) {
                container.classList.add('show');
            } else {
                container.classList.remove('show');
            }
        }

        // Initialize
        onScroll();

        // Listen for scroll events
        window.addEventListener('scroll', onScroll, { passive: true });

        // Recalculate on resize
        window.addEventListener('resize', onScroll);
    });
</script>
